name: Market Analysis Report

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Stock ticker symbol(s) - comma-separated for multiple (e.g., AAPL or AAPL,MSFT,GOOGL)'
        required: true
        type: string
      telegram_chat_id:
        description: 'Telegram chat ID to post the report'
        required: false
        type: string

jobs:
  market-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run market analysis
        env:
          YAHOO_FINANCE_API_KEY: ${{ secrets.YAHOO_FINANCE_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.telegram_chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/main.py \
            --ticker "${{ inputs.ticker }}" \
            --telegram-chat-id "${{ inputs.telegram_chat_id }}" \
            --log-csv
      
      - name: Commit CSV logs
        if: always()
        run: |
          git config user.name "Market Analysis Bot"
          git config user.email "bot@market-analysis.local"
          if [[ -f "data/market_analysis.csv" ]]; then
            git add data/market_analysis.csv
            git commit -m "Add market analysis for ${{ inputs.ticker }} on $(date +%Y-%m-%d)" || true
            git push
          fi
      
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-logs
          path: |
            data/market_analysis.csv
            logs/
